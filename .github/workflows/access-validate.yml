# Checks every pull request that touches access/. Runs on GitHub-hosted
# runners with a read-only token and no secrets (the last job may only re-run
# this workflow). The checking tool and the
# policy always come from the target branch (main), never from the pull request,
# so a pull request cannot weaken the rules it is judged by.
name: access-validate

on:
  pull_request:
    branches: [main]
    paths: ["access/**"]
    types: [opened, synchronize, reopened, labeled, unlabeled]
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  contents: read
  pull-requests: read

concurrency:
  # Per event, so re-running the pull_request check cannot cancel the review run.
  group: access-validate-${{ github.event_name }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main (tool + policy)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false

      - name: Check out the pull request (data only)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: head
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version-file: base/api/go.mod
          cache-dependency-path: base/api/go.sum

      - name: Build accessctl from main
        working-directory: base/api
        run: go build -o "$RUNNER_TEMP/accessctl" ./cmd/accessctl

      - name: Classify the pull request
        id: kind
        env:
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          changed=$(git -C head diff --name-only "$BASE_SHA" HEAD)
          echo "Changed files:"; echo "$changed"
          if echo "$LABELS" | grep -q '"access-revoke"'; then kind=revoke
          elif echo "$LABELS" | grep -q '"access-request"'; then kind=request
          else kind=other; fi
          if [ "$kind" != other ] && [ "$(echo "$changed" | grep -vx 'access/grants.yaml' | grep -c .)" != 0 ]; then
            echo "::error::An access request or revoke may only change access/grants.yaml"; exit 1
          fi
          if [ "$kind" = other ] && echo "$changed" | grep -qx 'access/grants.yaml'; then
            echo "::error::Changes to access/grants.yaml must come from the dashboard (label access-request or access-revoke)"; exit 1
          fi
          echo "kind=$kind" >> "$GITHUB_OUTPUT"

      - name: Validate the request against the policy
        if: steps.kind.outputs.kind != 'other'
        id: check
        run: |
          "$RUNNER_TEMP/accessctl" validate \
            --policy base/access/policy.yaml \
            --base base/access/grants.yaml \
            --head head/access/grants.yaml \
            --kind "${{ steps.kind.outputs.kind }}"

      - name: Check the changed policy
        if: steps.kind.outputs.kind == 'other'
        run: |
          "$RUNNER_TEMP/accessctl" check-policy --policy head/access/policy.yaml --grants head/access/grants.yaml
          echo "This pull request changes the access policy. Review it like any security change."

      - name: Admin approvals
        if: steps.kind.outputs.kind != 'other'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          "$RUNNER_TEMP/accessctl" approvals \
            --policy base/access/policy.yaml \
            --pr "${{ github.event.pull_request.number }}" \
            --required "${{ steps.check.outputs.required_approvals }}" \
            --requester "${{ steps.check.outputs.requester_email }}"

  # The check that ran when the pull request was opened failed for lack of
  # approvals, and GitHub keeps showing it next to this one. Once the approvals
  # are in, re-run it so the pull request does not show a stale failure.
  rerun-opened-check:
    needs: validate
    if: github.event_name == 'pull_request_review'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Re-run the latest failed pull_request check
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          api="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions"
          auth=(-H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json")
          run=$(curl -fsSL "${auth[@]}" "$api/workflows/access-validate.yml/runs?event=pull_request&head_sha=$HEAD_SHA&per_page=1" |
            jq -r '.workflow_runs[0] | select(.conclusion == "failure") | .id')
          if [ -z "$run" ]; then echo "Nothing to re-run."; exit 0; fi
          echo "Re-running run $run"
          curl -fsSL -X POST "${auth[@]}" "$api/runs/$run/rerun"
