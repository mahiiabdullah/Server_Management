worker_processes auto;
events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  server_tokens off;
  sendfile      on;

  log_format json escape=json '{"time":"$time_iso8601","request_id":"$request_id","ip":"$remote_addr",'
                              '"method":"$request_method","uri":"$request_uri","status":$status,'
                              '"bytes":$body_bytes_sent,"duration_s":$request_time}';
  access_log /dev/stdout json;
  error_log  /dev/stderr warn;

  # Docker's embedded DNS, so restarted containers are re-resolved.
  resolver 127.0.0.11 valid=10s ipv6=off;

  map $http_upgrade $connection_upgrade { default upgrade; '' close; }

  # HTTP: health probe for Docker, ACME challenges, and a redirect for everything else.
  server {
    listen 80 default_server;
    server_name _;
    location = /nginx-health { access_log off; return 200 "ok\n"; }
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
  }

  server {
    listen 443 ssl;
    http2 on;                                   # decision D5: replaces "listen ... http2"
    server_name _;                              # set to your domain, e.g. monitor.example.com

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;
    # Next.js needs inline scripts for hydration data; everything else is same-origin only.
    add_header Content-Security-Policy   "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    client_max_body_size 10m;                   # CSV invoice uploads

    # Only the versioned API is exposed. /healthz, /readyz at the root and anything
    # Prometheus-related are never forwarded.
    location /api/v1/ {
      set $api http://api:8080;
      proxy_pass $api;
      proxy_http_version 1.1;
      proxy_set_header Host              $host;
      proxy_set_header X-Request-Id      $request_id;
      proxy_set_header X-Forwarded-For   $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 30s;
    }
    location /api/ { return 404; }

    location / {
      set $web http://web:3000;
      proxy_pass $web;
      proxy_http_version 1.1;
      proxy_set_header Host              $host;
      proxy_set_header X-Request-Id      $request_id;
      proxy_set_header X-Forwarded-For   $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade           $http_upgrade;
      proxy_set_header Connection        $connection_upgrade;
    }
  }
}
