# Local development only: plain HTTP on :80 (published as 8088). Production uses nginx.conf.
worker_processes auto;
events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  server_tokens off;
  access_log    /dev/stdout;
  resolver 127.0.0.11 valid=10s ipv6=off;
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }

  server {
    listen 80 default_server;
    server_name _;

    add_header X-Content-Type-Options  "nosniff" always;
    add_header X-Frame-Options         "DENY" always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    client_max_body_size 10m;

    location = /nginx-health { access_log off; return 200 "ok\n"; }

    location /api/v1/ {
      set $api http://api:8080;
      proxy_pass $api;
      proxy_http_version 1.1;
      proxy_set_header Host              $host;
      proxy_set_header X-Request-Id      $request_id;
      proxy_set_header X-Forwarded-For   $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 30s;
    }
    location /api/ { return 404; }

    location / {
      set $web http://web:3000;
      proxy_pass $web;
      proxy_http_version 1.1;
      proxy_set_header Host              $host;
      proxy_set_header X-Forwarded-For   $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade           $http_upgrade;
      proxy_set_header Connection        $connection_upgrade;
    }
  }
}
