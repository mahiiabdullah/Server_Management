# Prometheus is the only scraper. Targets come from targets/fleet.json, which the
# Go API writes from the PostgreSQL inventory (file-based service discovery).
# Per-target intervals come from the __scrape_interval__ / __scrape_timeout__
# labels the API writes, so no relabelling is needed here.
global:
  scrape_interval: 30s
  scrape_timeout: 10s
  evaluation_interval: 30s

scrape_configs:
  - job_name: node
    file_sd_configs:
      - files: [/targets/fleet.json]
        refresh_interval: 30s
    # Optional Node Exporter basic auth / TLS (plan section 3.6). Uncomment and
    # mount the password file when exporters are reachable over the internet.
    # basic_auth:
    #   username: prometheus
    #   password_file: /etc/prometheus/node_exporter_password
    # tls_config:
    #   ca_file: /etc/prometheus/node_exporter_ca.pem

  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
